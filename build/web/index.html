<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SmartTrolley Progressive Web App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- App identity -->
  <title>SmartTrolley</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0175C2">

  <!-- Apple specific -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SmartTrolley">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Base href for Flutter -->
  <base href="/">
</head>
<body>
<script src="flutter_bootstrap.js" async></script>

<!-- Install Prompt & Service Worker -->
<script>
  let deferredPrompt;

  // Save the install prompt
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('Install prompt saved');
    // Optionally show custom install button
  });

  function promptInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
        } else {
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
      });
    }
  }

  // App installed event
  window.addEventListener('appinstalled', () => {
    console.log('App successfully installed');
    deferredPrompt = null;
  });

  // Service worker registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js')
        .then(function (registration) {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch(function (error) {
          console.log('Service Worker registration failed:', error);
        });
    });
  }
</script>
</body>
</html>
